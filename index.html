<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cyber security · Secpedia</title>
    <script>
      // Follow the OS colour scheme via the `.dark` class (see src/index.css).
      // Inline so the first paint already has the right theme.
      const scheme = matchMedia("(prefers-color-scheme: dark)")
      const applyScheme = () =>
        document.documentElement.classList.toggle("dark", scheme.matches)
      applyScheme()
      scheme.addEventListener("change", applyScheme)
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
